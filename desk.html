<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>QuestRock submissions</title>
  <link rel="stylesheet" href="/styles.css?v=12">
</head>
<body>
<header>
  <div class="shell header-inner">
    <a href="/"><img class="logo" src="/questrock-logo.png?v=3" alt="QuestRock"></a>
    <button class="sign-out" type="button" id="signOut">Sign out</button>
  </div>
</header>
<main>
  <div class="wrap">
    <div class="desk-hero">
      <h1>Equity Access submissions</h1>
      <p id="roleNotice">Inquiries from the public form. Licensed LO authorizes any Aven step. Admin coordinates only. Nothing is sent to Aven automatically.</p>
    </div>
    <div class="kpis">
      <div class="kpi"><small>Showing</small><strong id="metricShown">0</strong></div>
      <div class="kpi"><small>Saved inquiries</small><strong id="metricAll">0</strong></div>
      <div class="kpi"><small>With phone</small><strong id="metricPhone">0</strong></div>
      <div class="kpi"><small>Need information</small><strong id="metricMissing">0</strong></div>
    </div>
    <form class="desk-filters" id="filters" autocomplete="off">
      <label class="desk-search">
        <span>Search</span>
        <input class="field" type="search" id="q" placeholder="Name, email, phone, or state">
      </label>
      <label>
        <span>From</span>
        <input class="field" type="date" id="from">
      </label>
      <label>
        <span>To</span>
        <input class="field" type="date" id="to">
      </label>
      <label>
        <span>Preset</span>
        <select class="field" id="preset">
          <option value="all">All dates</option>
          <option value="today">Today</option>
          <option value="7">Last 7 days</option>
          <option value="30">Last 30 days</option>
        </select>
      </label>
      <button class="secondary" type="button" id="clearFilters">Clear</button>
    </form>
    <div class="desk-grid">
      <div class="panel lead-list" id="leadList"></div>
      <div class="panel detail" id="leadDetail"></div>
    </div>
    <p style="padding:22px 0 54px;color:#667781;font-size:12px">Hidden staff page. Username and password required.</p>
  </div>
</main>
<footer class="site">
  <div class="fgrid">
    <div>
      <img class="logo-mark" src="/questrock-logo.png?v=3" alt="QuestRock">
      <p>QuestRock LLC — NMLS #1871037</p>
    </div>
  </div>
</footer>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const amountLabels = { '10-49': '$10,000–$49,999', '50-99': '$50,000–$99,999', '100-249': '$100,000–$249,999', '250-plus': '$250,000+' };
  const human = {
    purpose:{debt:'Higher-interest debt',renovation:'Home improvement',flexibility:'Financial flexibility',investment:'Real estate investment',other:'Other'},
    occupancy:{primary:'Primary residence',secondary:'Second home',investment:'Investment property',other:'Other'},
    propertyType:{single_family:'Single-family',townhouse:'Townhouse',condo:'Condo',two_four:'2–4 units',mixed_use:'Mixed use',commercial:'Commercial',other:'Other'},
    valueRange:{under250:'Under $250k','250-399':'$250k–$399k','400-599':'$400k–$599k','600-999':'$600k–$999k','1000plus':'$1m+',unknown:'Not sure'},
    balanceRange:{none:'No mortgage',under100:'Under $100k','100-199':'$100k–$199k','200-299':'$200k–$299k','300-499':'$300k–$499k','500plus':'$500k+',unknown:'Not sure'}
  };
  const escapeHtml = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const textValue = (name, val) => name in human ? (human[name][val] || val || '—') : (val || '—');
  let selectedId = null, leads = [], staff = { role: 'admin', name: 'Jason' };

  function when(iso){
    const d = new Date(iso);
    return isNaN(d) ? '' : d.toLocaleString();
  }
  function ymd(iso){
    const d = new Date(iso);
    if (isNaN(d)) return '';
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  function todayYmd(){
    return ymd(new Date().toISOString());
  }
  function daysAgo(n){
    const d = new Date();
    d.setDate(d.getDate() - n);
    return ymd(d.toISOString());
  }
  function haystack(l){
    return [
      l.first_name, l.last_name, l.email, l.phone, l.property_state,
      textValue('purpose', l.purpose), amountLabels[l.amount]||l.amount
    ].join(' ').toLowerCase();
  }
  function visible(){
    const q = ($('q').value || '').trim().toLowerCase();
    const from = $('from').value;
    const to = $('to').value;
    return leads.filter(l => {
      const day = ymd(l.created_at);
      if (from && day && day < from) return false;
      if (to && day && day > to) return false;
      if (q && !haystack(l).includes(q)) return false;
      return true;
    });
  }
  function render(){
    const rows = visible();
    $('metricShown').textContent = rows.length;
    $('metricAll').textContent = leads.length;
    $('metricPhone').textContent = leads.filter(l => (l.phone||'').length >= 10).length;
    $('metricMissing').textContent = leads.filter(l => l.route==='NEEDS_INFORMATION').length;
    $('roleNotice').textContent = staff.role === 'originator'
      ? 'Licensed LO: review product fit and authorize Aven preparation. You cannot quote a rate here.'
      : 'Jason · Admin: queue, missing facts, and follow-up only. No product advice, pricing, or Aven authorization.';
    if (!leads.length){
      $('leadList').innerHTML = '<div style="padding:18px;color:#667781;font-size:13px">No inquiries yet.</div>';
      $('leadDetail').innerHTML = '<p>Waiting for the first request.</p>';
      return;
    }
    if (!rows.length){
      $('leadList').innerHTML = '<div style="padding:18px;color:#667781;font-size:13px">No inquiries match that search or date range.</div>';
      $('leadDetail').innerHTML = '<p>Change the search or dates to see a request.</p>';
      return;
    }
    if (!selectedId || !rows.some(l=>l.id===selectedId)) selectedId = rows[0].id;
    $('leadList').innerHTML = rows.map(l=>`<button class="lead-item ${l.id===selectedId?'active':''}" data-id="${escapeHtml(l.id)}"><div><strong>${escapeHtml(l.first_name||'')} ${escapeHtml(l.last_name||'')}</strong><small>${escapeHtml(l.property_state||'')} · ${escapeHtml(textValue('purpose', l.purpose))} · ${escapeHtml(when(l.created_at))}</small><small>${escapeHtml(l.phone||'')} · ${escapeHtml(l.email||'')}</small></div><div style="text-align:right"><div class="amount">${escapeHtml(amountLabels[l.amount]||'')}</div></div></button>`).join('');
    $('leadList').querySelectorAll('[data-id]').forEach(n=>n.addEventListener('click', ()=>{ selectedId=n.dataset.id; render(); }));
    const l = rows.find(x=>x.id===selectedId) || rows[0];
    const records = [
      ['Phone', l.phone],
      ['Email', l.email],
      ['Preferred contact', l.preferred_contact],
      ['Purpose', textValue('purpose', l.purpose)],
      ['Requested line', amountLabels[l.amount]||l.amount],
      ['State', l.property_state],
      ['Property type', textValue('propertyType', l.property_type)],
      ['Occupancy', textValue('occupancy', l.occupancy)],
      ['Value range', textValue('valueRange', l.value_range)],
      ['Mortgage balance', textValue('balanceRange', l.balance_range)]
    ];
    const owner = (l.payload && l.payload.assigned_owner) || 'Licensed review required';
    const route = l.route_label || l.route || 'Review';
    const flags = Array.isArray(l.flags) ? l.flags : [];
    const avenOk = l.payload && l.payload.aven_authorized;
    const loBtns = staff.role === 'originator'
      ? `<button type="button" class="primary" data-action="authorize_aven_prep">Authorize Aven preparation</button><button type="button" class="secondary" data-action="mark_alt_review">Alternate product review</button>`
      : `<button type="button" class="secondary" data-action="admin_queued">Mark admin queued</button>`;
    $('leadDetail').innerHTML = `<h2>${escapeHtml(l.first_name||'')} ${escapeHtml(l.last_name||'')}</h2><p>${escapeHtml(when(l.created_at))} · ${escapeHtml(l.status||'')}</p><p class="desk-route"><strong>${escapeHtml(route)}</strong> · Owner: ${escapeHtml(owner)}${avenOk?' · Aven prep authorized':''}</p><p class="fine">Work-routing only. No credit decision, rate, or eligibility finding.</p>${flags.length?`<ul class="fine">${flags.map(f=>`<li>${escapeHtml(f)}</li>`).join('')}</ul>`:''}<div class="review-grid">${records.map(([k,v])=>`<div class="review-line"><span>${escapeHtml(k)}</span><strong>${escapeHtml(v||'—')}</strong></div>`).join('')}</div><div class="step-actions">${loBtns}<button type="button" class="plain" data-action="mark_need_info">Need information</button></div>`;
    $('leadDetail').querySelectorAll('[data-action]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const res = await fetch('/api/inquiry-action', {
          method:'POST', credentials:'same-origin',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ id: l.id, action: btn.dataset.action })
        });
        const data = await res.json().catch(()=>({}));
        if (!res.ok || !data.ok) { alert(data.error || 'Could not update'); return; }
        const i = leads.findIndex(x=>x.id===l.id);
        if (i>=0 && data.row) leads[i] = data.row;
        render();
      });
    });
  }
  function applyPreset(){
    const p = $('preset').value;
    if (p === 'all') { $('from').value = ''; $('to').value = ''; }
    else if (p === 'today') { $('from').value = todayYmd(); $('to').value = todayYmd(); }
    else { $('from').value = daysAgo(Number(p)-1); $('to').value = todayYmd(); }
    render();
  }
  $('q').addEventListener('input', render);
  $('from').addEventListener('change', () => { $('preset').value = 'all'; render(); });
  $('to').addEventListener('change', () => { $('preset').value = 'all'; render(); });
  $('preset').addEventListener('change', applyPreset);
  $('clearFilters').addEventListener('click', () => {
    $('q').value = '';
    $('from').value = '';
    $('to').value = '';
    $('preset').value = 'all';
    render();
  });
  document.getElementById('signOut').addEventListener('click', async () => {
    await fetch('/api/desk-logout', { method: 'POST', credentials: 'same-origin' });
    location.href = '/desk';
  });
  fetch('/api/inquiries', { credentials: 'same-origin' }).then(r=>{
    if (r.status === 401) { location.href = '/desk'; return null; }
    return r.json();
  }).then(data=>{
    leads = data && Array.isArray(data.rows) ? data.rows : [];
    if (data && data.staff) staff = data.staff;
    render();
  }).catch(()=>render());
})();
</script>
</body>
</html>
